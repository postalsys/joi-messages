name: npm-oidc-debug

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    silly-log:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: npm install -g npm@latest
            - run: npm ci
            - name: Publish existing version with silly logging
              run: |
                  echo "npm: $(npm --version)"
                  echo "GITHUB_ACTIONS=$GITHUB_ACTIONS CI=$CI"
                  npm pkg set version=1.0.5
                  npm publish --access public --loglevel silly > silly.log 2>&1 || true
                  echo "=== lines mentioning oidc / trusted / auth / token:"
                  grep -inE 'oidc|trusted|needauth|authoriz|_authToken|bearer' silly.log | head -40
                  echo "=== last 25 lines:"
                  tail -25 silly.log
