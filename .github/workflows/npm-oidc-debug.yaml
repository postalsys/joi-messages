name: npm-oidc-debug

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    debug:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - run: npm install -g npm@latest
            - name: Inspect OIDC environment
              run: |
                  echo "npm version: $(npm --version)"
                  echo "node version: $(node --version)"
                  echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
                  echo "--- userconfig .npmrc contents:"
                  cat "$NPM_CONFIG_USERCONFIG" || echo "(no file)"
                  echo "--- OIDC env vars present?"
                  echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
                  echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-no}"
                  echo "--- resolved authToken config:"
                  npm config get //registry.npmjs.org/:_authToken
                  echo "--- registry:"
                  npm config get registry
            - name: Publish dry run with verbose logging
              run: npm publish --access public --dry-run --loglevel verbose 2>&1 | grep -iE 'oidc|trusted|auth|provenance|registry' | head -40
