on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write
    # Required for npm trusted publishing (OIDC). No npm token is used.
    id-token: write

name: release
jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  release-type: node
            # The logic below handles the npm publication:
            - uses: actions/checkout@v7
              # these if statements ensure that a publication only occurs when
              # a new release is created:
              if: ${{ steps.release.outputs.release_created == 'true' }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
              if: ${{ steps.release.outputs.release_created == 'true' }}
            # Trusted publishing needs npm 11.5.1 or later
            - run: npm install -g npm@latest
              if: ${{ steps.release.outputs.release_created == 'true' }}
            - run: npm ci
              if: ${{ steps.release.outputs.release_created == 'true' }}
            # Authentication comes from the OIDC token, provenance is attached
            # automatically, so neither NODE_AUTH_TOKEN nor --provenance is needed
            - run: npm publish --access public
              if: ${{ steps.release.outputs.release_created == 'true' }}
