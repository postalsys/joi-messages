on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write
    id-token: write

name: release
jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  release-type: node
            # The logic below handles the npm publication:
            - uses: actions/checkout@v6
              # these if statements ensure that a publication only occurs when
              # a new release is created:
              if: ${{ steps.release.outputs.release_created }}
            # No registry-url on purpose. It makes setup-node write an .npmrc
            # with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and
            # inject a placeholder NODE_AUTH_TOKEN. npm defaults to
            # registry.npmjs.org anyway, and trusted publishing authenticates
            # through the workflow OIDC token instead.
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
              if: ${{ steps.release.outputs.release_created }}
            - run: npm ci
              if: ${{ steps.release.outputs.release_created }}
            - run: npm publish --provenance --access public
              if: ${{ steps.release.outputs.release_created }}
